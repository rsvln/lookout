<!DOCTYPE html>
<html lang="{{web.lang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lookout · {{web.login.title}}</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=%VERSION%">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0d1117">
<style>
  :root { --bg:#0d1117; --bg2:#161b22; --border:#30363d; --text:#c9d1d9; --muted:#8b949e; --accent:#58a6ff; --red:#f85149; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
  .card { width: min(360px, 92vw); background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 28px 24px; }
  h1 { font-size: 18px; letter-spacing: .04em; color: var(--accent); margin-bottom: 6px; }
  p { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 6px; font-size: 14px; }
  input:focus { outline: none; border-color: var(--accent); }
  button { width: 100%; margin-top: 18px; padding: 9px; border: 0; border-radius: 6px; background: var(--accent); color: #000; font-weight: 600; cursor: pointer; }
  button:hover { opacity: .9; }
  .err { display: none; margin-top: 12px; color: var(--red); font-size: 13px; }
  .err.show { display: block; }
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">
  <h1>Lookout</h1>
  <p>{{web.login.title}}</p>
  <label for="user">{{web.login.user}}</label>
  <input id="user" name="username" autocomplete="username" required autofocus>
  <label for="password">{{web.login.password}}</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">{{web.login.submit}}</button>
  <div class="err" id="err"></div>
</form>
<script>
const t = (k) => ({ "denied": "{{web.login.failed}}", "throttled": "{{web.login.throttled}}" }[k] || k);
const next = (() => {
  const n = new URLSearchParams(location.search).get("next") || "/";
  return n.startsWith("/") && !n.startsWith("//") && !n.startsWith("/login") ? n : "/";
})();
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.classList.remove("show");
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user: document.getElementById("user").value, password: document.getElementById("password").value })
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok && data.ok) { location.replace(next); return; }
    err.textContent = t(data.error || "denied");
  } catch { err.textContent = t("denied"); }
  err.classList.add("show");
});
</script>
</body>
</html>
